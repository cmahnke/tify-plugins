<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="Basic embed — tify-plugins">Basic embed — tify-plugins</title>
  </head>
  <body>
    <main class="example">
      <p><a href="../../../" data-i18n="← all examples">← all examples</a></p>
      <h1 data-i18n="Basic embed">Basic embed</h1>
      <header class="controls">
        <input
          id="manifest"
          type="url"
          data-i18n-aria="IIIF manifest URL"
          aria-label="IIIF manifest URL"
        />
        <button id="load" type="button" data-i18n="Load">Load</button>
      </header>
      <div id="tify" class="tify-frame"></div>
      <details class="code-example">
        <summary data-i18n="Code example">Code example</summary>
        <pre><code>import Tify from 'tify';

const tify = new Tify({
  container: '#tify',
  manifestUrl: 'https://example.org/manifest.json',
});</code></pre>
        <p class="code-links">
          <a href="../../../docs/core.html" data-i18n="Documentation">Documentation</a>
        </p>
      </details>
    </main>
    <script type="module" src="./main.ts"></script>
