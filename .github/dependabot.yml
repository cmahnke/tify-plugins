# Dependabot covers the root plus every workspace package individually:
# the root npm entry does not pick up workspace manifests on its own.
# Each module still gets its own lint status via the CI matrix.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        versions:
          - '>= 7'
  - package-ecosystem: npm
    directory: /packages/core
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /packages/plugin-side-panel
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /packages/plugin-image-overlays
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /packages/plugin-hdr
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /packages/plugin-c2pa
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /packages/plugin-annotorious
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /packages/plugin-musicxml
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
