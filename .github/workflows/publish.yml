# Publishes every workspace package to npm AND to GitHub Packages — but only
# after the full CI run (lint, typecheck, i18n/TEI checks, e2e browser matrix)
# passes. Two triggers, both guarded: only packages whose version changed
# since the previous release tag are published, so re-running is a no-op.
#
# - Manual: `workflow_dispatch` from the Actions tab. Compares against the
#   newest reachable tag.
# - Release: publishing a GitHub Release runs the workflow for that tag;
#   the guard compares against the tag before it.
#
# Bump versions first (all workspaces share one version) — see the release
# process in README/PLANS; without a bump nothing is published.
#
# - npmjs keeps the @projektemacher scope via trusted publishing (OIDC):
#   no token is stored. Each package needs a Trusted Publisher entry on
#   npmjs.com (owner cmahnke, repo tify-plugins, workflow publish.yml, with
#   `npm publish` allowed — the post-Sep-2026 default permits only
#   `npm stage publish`). Publishes carry provenance attestations.
#   After the first green OIDC release, delete the obsolete NPM_TOKEN secret.
# - GitHub Packages requires the scope to match the repo owner, so each
#   package is renamed to @cmahnke/tify-plugin-* at publish time (in place,
#   never committed); dependencies keep pointing at the @projektemacher
#   packages on npmjs. Auth uses the built-in GITHUB_TOKEN.
name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Which packages are unreleased? Version diff against the previous release
  # tag (all of them when there is none). The guard lives in
  # scripts/ci-publish-guard.mjs so it stays unit- and CI-testable.
  guard:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.diff.outputs.matrix }}
      any: ${{ steps.diff.outputs.any }}
      dirs: ${{ steps.diff.outputs.dirs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags carry the version history the diff needs
      - id: base
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            # The tag this release just created: compare against its parent.
            previous=$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)
          else
            # Manual run: newest reachable tag (empty → first release).
            previous=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - id: diff
        run: node scripts/ci-publish-guard.mjs "${{ steps.base.outputs.previous }}"

  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci, guard]
    if: needs.guard.outputs.any == 'true'
    runs-on: ubuntu-latest
    # npm trusted publishing (OIDC): the publish step mints a short-lived
    # credential itself, so no long-lived NPM_TOKEN is stored. Requires a
    # Trusted Publisher entry per package on npmjs.com (repo
    # cmahnke/tify-plugins, workflow publish.yml, npm publish allowed).
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # One at a time: the guard emits core first, so it lands on npmjs
      # before the plugins that depend on it.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.guard.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Bundled npm may predate trusted publishing (needs >= 11.5.1).
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      # dist/ is gitignored, so the packages must be built here.
      - name: Build
        run: npm run build:packages
      # Registry check: skips versions that are already live (e.g. a tag
      # republished, or the version guard and registry disagreeing).
      - id: check_npm
        name: Check npmjs for this version
        working-directory: ${{ matrix.dir }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          OUT=$(npm view "$NAME@$VERSION" version --registry=https://registry.npmjs.org 2>&1) || true
          if [ "$OUT" = "$VERSION" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$OUT" | grep -q "E404"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm view failed unexpectedly: $OUT"
            exit 1
          fi
      - name: Publish ${{ matrix.name }} to npmjs
        if: steps.check_npm.outputs.exists != 'true'
        run: npm publish --workspace "${{ matrix.dir }}" --provenance
      - name: Skip notice (already on npmjs)
        if: steps.check_npm.outputs.exists == 'true'
        run: echo "${{ matrix.name }} already on npmjs, skipping publish"

  publish-gpr:
    needs: [ci, guard]
    if: needs.guard.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.guard.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@cmahnke'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build:packages
      - name: Rename scope for GitHub Packages (must match the owner)
        run: |
          node -e "
            const fs = require('fs');
            const file = '${{ matrix.dir }}/package.json';
            const p = JSON.parse(fs.readFileSync(file, 'utf8'));
            p.name = p.name.replace('@projektemacher/', '@cmahnke/');
            fs.writeFileSync(file, JSON.stringify(p, null, 2) + '\n');
          "
      - name: Publish ${{ matrix.name }} to GitHub Packages
        run: npm publish --access public
        working-directory: ${{ matrix.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
